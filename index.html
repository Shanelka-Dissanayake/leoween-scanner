<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>LEOWEEN 2026 Scanner</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #281006 0%, #0a0a0a 38%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: auto;
      padding: 28px 20px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 1.5px;
    }

    .header p {
      margin: 7px 0 0;
      color: #a3a3a3;
      font-size: 14px;
    }

    .scanner-card {
      background: #121212;
      border: 1px solid #292929;
      border-radius: 24px;
      padding: 14px;
      box-shadow:
        0 20px 50px rgba(0,0,0,.45);
    }

    .camera-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
    }

    #qr-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 999px rgba(0,0,0,.20);
    }

    .scan-box {
      position: absolute;
      width: 68%;
      height: 68%;
      left: 16%;
      top: 16%;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 38px;
      height: 38px;
      border-color: #f97316;
    }

    .tl {
      top: 0;
      left: 0;
      border-top: 4px solid #f97316;
      border-left: 4px solid #f97316;
      border-radius: 10px 0 0 0;
    }

    .tr {
      top: 0;
      right: 0;
      border-top: 4px solid #f97316;
      border-right: 4px solid #f97316;
      border-radius: 0 10px 0 0;
    }

    .bl {
      bottom: 0;
      left: 0;
      border-bottom: 4px solid #f97316;
      border-left: 4px solid #f97316;
      border-radius: 0 0 0 10px;
    }

    .br {
      bottom: 0;
      right: 0;
      border-bottom: 4px solid #f97316;
      border-right: 4px solid #f97316;
      border-radius: 0 0 10px 0;
    }

    .hint {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 15px 5px 3px;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 25px 20px;
      border-radius: 20px;
      text-align: center;
    }

    .checking {
      background: #242424;
      border: 1px solid #3d3d3d;
    }

    .valid {
      background: #123f25;
      border: 1px solid #21864a;
    }

    .used {
      background: #521919;
      border: 1px solid #9f3030;
    }

    .invalid {
      background: #521919;
      border: 1px solid #9f3030;
    }

    .result-title {
      font-size: 29px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .ticket-id {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .guest {
      font-size: 17px;
      line-height: 1.6;
    }

    .waiting {
      margin-top: 15px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }

  </style>
</head>


<body>

<div class="container">

  <div class="header">

    <h1>LEOWEEN 2026</h1>

    <p>ENTRANCE CHECK-IN</p>

  </div>


  <div class="scanner-card">

    <div class="camera-wrap">

      <video
        id="qr-video"
        playsinline
      ></video>


      <div class="shade"></div>


      <div class="scan-box">

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

      </div>

    </div>


    <div class="hint">
      Place one ticket QR inside the frame
    </div>

  </div>


  <div id="result"></div>


  <div class="waiting">
    LEOWEEN 2026 • Authorized Check-In
  </div>

</div>


<script type="module">

  import QrScanner from
    "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


  const video =
    document.getElementById("qr-video");

  const resultBox =
    document.getElementById("result");


  let processing = false;



  const scanner =
    new QrScanner(

      video,

      function(result) {

        if (processing) {
          return;
        }


        const qrData =
          result.data;


        if (
          !qrData ||
          !qrData.startsWith("LEOWEEN26|")
        ) {

          showInvalid(
            "INVALID QR",
            "This is not a LEOWEEN ticket."
          );

          return;
        }


        processing = true;


        showChecking();


        /*
          Send the QR back to the
          Apps Script controller window.
        */

        if (
          window.opener &&
          !window.opener.closed
        ) {

          window.opener.postMessage(
            {
              type: "LEOWEEN_SCAN",
              qrData: qrData
            },
            "*"
          );

        }

        else {

          showInvalid(
            "CONNECTION ERROR",
            "Please open the scanner through the LEOWEEN staff page."
          );

          resetScanner();
        }

      },

      {
        preferredCamera: "environment",

        maxScansPerSecond: 8,

        highlightScanRegion: false,

        highlightCodeOutline: false,

        returnDetailedScanResult: true
      }

    );



  try {

    await scanner.start();

  }

  catch(error) {

    showInvalid(
      "CAMERA ERROR",
      "Please allow camera access and reload the page."
    );

    console.error(error);
  }



  /*
    Receive verification result
    from Apps Script.
  */

  window.addEventListener(
    "message",

    function(event) {

      const message =
        event.data;


      if (!message) {
        return;
      }



      if (
        message.type ===
        "LEOWEEN_RESULT"
      ) {

        const result =
          message.result;


        if (
          result.type === "VALID"
        ) {

          showValid(result);

        }


        else if (
          result.type === "USED"
        ) {

          showUsed(result);

        }


        else if (
          result.type ===
          "AUTH_ERROR"
        ) {

          showInvalid(
            "WRONG PIN",
            "Staff authentication failed."
          );

        }


        else {

          showInvalid(
            "INVALID TICKET",
            result.message ||
            "Ticket could not be verified."
          );
        }


        resetScanner();
      }



      if (
        message.type ===
        "LEOWEEN_ERROR"
      ) {

        showInvalid(
          "SYSTEM ERROR",
          message.message ||
          "Unable to verify ticket."
        );

        resetScanner();
      }

    }
  );



  function showChecking() {

    resultBox.style.display =
      "block";

    resultBox.className =
      "checking";

    resultBox.innerHTML =
      `
      <div class="result-title">
        CHECKING...
      </div>

      <div class="guest">
        Verifying ticket
      </div>
      `;
  }



  function showValid(result) {

    navigator.vibrate?.(150);


    resultBox.style.display =
      "block";

    resultBox.className =
      "valid";

    resultBox.innerHTML =
      `
      <div class="result-title">
        ✓ VALID
      </div>

      <div class="ticket-id">
        ${escapeHtml(result.ticketId)}
      </div>

      <div class="guest">
        ${escapeHtml(result.guestName)}
        <br>
        ${escapeHtml(result.ticketType)}
      </div>
      `;
  }



  function showUsed(result) {

    navigator.vibrate?.([150,100,150]);


    let previous =
      "";


    if (result.checkInTime) {

      previous =
        `
        <br><br>
        Previously checked in:<br>
        ${escapeHtml(
          String(result.checkInTime)
        )}
        `;
    }


    resultBox.style.display =
      "block";

    resultBox.className =
      "used";

    resultBox.innerHTML =
      `
      <div class="result-title">
        ✕ ALREADY USED
      </div>

      <div class="ticket-id">
        ${escapeHtml(result.ticketId)}
      </div>

      <div class="guest">

        ${escapeHtml(result.guestName)}

        ${previous}

      </div>
      `;
  }



  function showInvalid(
    title,
    message
  ) {

    navigator.vibrate?.([120,80,120]);


    resultBox.style.display =
      "block";

    resultBox.className =
      "invalid";

    resultBox.innerHTML =
      `
      <div class="result-title">
        ✕ ${escapeHtml(title)}
      </div>

      <div class="guest">
        ${escapeHtml(message)}
      </div>
      `;
  }



  function resetScanner() {

    setTimeout(
      function() {

        processing = false;

        resultBox.style.display =
          "none";

      },
      3000
    );
  }



  function escapeHtml(value) {

    return String(value ?? "")

      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

</script>


</body>

</html>
