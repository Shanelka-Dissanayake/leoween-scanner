<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>LEOWEEN 2026 Check-In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #2b1005 0%, #090909 38%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: auto;
      padding: 30px 20px 45px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0;
      font-size: 29px;
      letter-spacing: 2px;
    }

    .header p {
      margin: 8px 0 0;
      color: #999;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .card {
      background: #141414;
      border: 1px solid #292929;
      border-radius: 22px;
      padding: 24px;
    }

    .card h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #080808;
      color: white;
      font-size: 20px;
      text-align: center;
      letter-spacing: 4px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #f97316;
      color: white;
    }

    .secondary {
      background: #272727;
      color: white;
    }

    #scannerPage {
      display: none;
    }

    .scanner-card {
      background: #141414;
      padding: 13px;
      border: 1px solid #292929;
      border-radius: 24px;
    }

    .camera {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 18px;
      background: black;
    }

    #qr-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .scan-frame {
      position: absolute;
      width: 66%;
      height: 66%;
      left: 17%;
      top: 17%;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 35px;
      height: 35px;
    }

    .tl {
      top: 0;
      left: 0;
      border-top: 4px solid #f97316;
      border-left: 4px solid #f97316;
      border-radius: 10px 0 0 0;
    }

    .tr {
      top: 0;
      right: 0;
      border-top: 4px solid #f97316;
      border-right: 4px solid #f97316;
      border-radius: 0 10px 0 0;
    }

    .bl {
      bottom: 0;
      left: 0;
      border-bottom: 4px solid #f97316;
      border-left: 4px solid #f97316;
      border-radius: 0 0 0 10px;
    }

    .br {
      bottom: 0;
      right: 0;
      border-bottom: 4px solid #f97316;
      border-right: 4px solid #f97316;
      border-radius: 0 0 10px 0;
    }

    .hint {
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 15px 4px 4px;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
    }

    .checking {
      background: #292929;
    }

    .valid {
      background: #123f25;
      border: 1px solid #21864a;
    }

    .used {
      background: #531818;
      border: 1px solid #a83232;
    }

    .invalid {
      background: #531818;
      border: 1px solid #a83232;
    }

    .result-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .ticket-id {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .details {
      font-size: 16px;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 11px;
      margin-top: 20px;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>LEOWEEN 2026</h1>
    <p>ENTRANCE CHECK-IN</p>
  </div>


  <!-- PIN SCREEN -->

  <div id="loginPage" class="card">

    <h2>Staff Access</h2>

    <p style="color:#aaa;">
      Enter the staff PIN to access the ticket scanner.
    </p>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      placeholder="••••••"
    >

    <button
      class="primary"
      onclick="openScanner()"
    >
      OPEN SCANNER
    </button>

  </div>


  <!-- SCANNER -->

  <div id="scannerPage">

    <div class="scanner-card">

      <div class="camera">

        <video
          id="qr-video"
          playsinline
        ></video>

        <div class="scan-frame">

          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>

        </div>

      </div>

      <div class="hint">
        Place one ticket QR inside the frame
      </div>

    </div>


    <div id="result"></div>


    <button
      id="nextButton"
      class="primary"
      onclick="scanNext()"
      style="display:none;"
    >
      SCAN NEXT TICKET
    </button>


    <button
      class="secondary"
      onclick="changePin()"
    >
      CHANGE STAFF PIN
    </button>

  </div>


  <div class="footer">
    LEOWEEN 2026 • AUTHORIZED CHECK-IN
  </div>

</div>


<script type="module">

  import QrScanner from
    "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


  const WEB_APP_URL =
    "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";


  let staffPin = "";

  let scanner = null;

  let processing = false;

  let requestTimeout = null;


  const video =
    document.getElementById("qr-video");

  const resultBox =
    document.getElementById("result");

  const nextButton =
    document.getElementById("nextButton");



  window.openScanner =
    async function() {

      const pin =
        document
          .getElementById("pin")
          .value
          .trim();


      if (!pin) {

        alert("Enter the staff PIN.");

        return;
      }


      staffPin = pin;


      document
        .getElementById("loginPage")
        .style.display = "none";


      document
        .getElementById("scannerPage")
        .style.display = "block";


      if (!scanner) {

        scanner =
          new QrScanner(

            video,

            function(result) {

              if (processing) {
                return;
              }


              const qrData =
                result.data;


              if (!qrData) {
                return;
              }


              if (
                !qrData.startsWith(
                  "LEOWEEN26|"
                )
              ) {

                processing = true;

                showResult(
                  "invalid",
                  "✕ INVALID QR",
                  "",
                  "This is not a LEOWEEN 2026 ticket."
                );

                showNextButton();

                return;
              }


              verifyTicket(
                qrData
              );

            },

            {
              preferredCamera:
                "environment",

              maxScansPerSecond:
                8,

              highlightScanRegion:
                false,

              highlightCodeOutline:
                false,

              returnDetailedScanResult:
                true
            }

          );
      }


      try {

        await scanner.start();

      }

      catch(error) {

        showResult(
          "invalid",
          "CAMERA ERROR",
          "",
          "Please allow camera access and reload the page."
        );

        console.error(error);
      }
    };



  function verifyTicket(qrData) {

    processing = true;


    showResult(
      "checking",
      "CHECKING...",
      "",
      "Verifying ticket"
    );


    /*
      Apps Script JSONP request.

      The PIN is entered by staff at runtime.
      It is NOT stored in this GitHub file.
    */


    const oldScript =
      document.getElementById(
        "leoween-api-request"
      );


    if (oldScript) {
      oldScript.remove();
    }


    const script =
      document.createElement("script");


    script.id =
      "leoween-api-request";


    const url =
      WEB_APP_URL +

      "?mode=api" +

      "&pin=" +
      encodeURIComponent(
        staffPin
      ) +

      "&qrData=" +
      encodeURIComponent(
        qrData
      ) +

      "&_=" +
      Date.now();


    script.src =
      url;


    script.onerror =
      function() {

        clearTimeout(
          requestTimeout
        );


        showResult(
          "invalid",
          "SYSTEM ERROR",
          "",
          "Could not connect to the ticket database."
        );


        showNextButton();
      };


    document.body.appendChild(
      script
    );


    requestTimeout =
      setTimeout(
        function() {

          if (!processing) {
            return;
          }


          showResult(
            "invalid",
            "CONNECTION TIMEOUT",
            "",
            "The ticket server did not respond."
          );


          showNextButton();

        },
        10000
      );
  }



  /*
    Apps Script calls this function
    after checking the ticket.
  */

  window.handleLeoweenResult =
    function(result) {

      clearTimeout(
        requestTimeout
      );


      if (!result) {

        showResult(
          "invalid",
          "SYSTEM ERROR",
          "",
          "No response received."
        );

        showNextButton();

        return;
      }



      if (
        result.type ===
        "VALID"
      ) {

        navigator.vibrate?.(150);


        showResult(
          "valid",
          "✓ VALID",
          result.ticketId,
          result.guestName +
          "\n" +
          result.ticketType
        );

      }



      else if (
        result.type ===
        "USED"
      ) {

        navigator.vibrate?.(
          [150, 100, 150]
        );


        let details =
          result.guestName;


        if (
          result.checkInTime
        ) {

          details +=
            "\n\nPreviously checked in:\n" +
            result.checkInTime;
        }


        showResult(
          "used",
          "✕ ALREADY USED",
          result.ticketId,
          details
        );

      }



      else if (
        result.type ===
        "AUTH_ERROR"
      ) {

        showResult(
          "invalid",
          "✕ WRONG PIN",
          "",
          "The staff PIN is incorrect."
        );

      }



      else {

        showResult(
          "invalid",
          "✕ INVALID TICKET",
          "",
          result.message ||
          "Ticket could not be verified."
        );

      }


      showNextButton();
    };



  function showResult(
    cssClass,
    title,
    ticketId,
    details
  ) {

    resultBox.style.display =
      "block";


    resultBox.className =
      cssClass;


    resultBox.innerHTML =
      "";


    const titleElement =
      document.createElement(
        "div"
      );


    titleElement.className =
      "result-title";


    titleElement.textContent =
      title;


    resultBox.appendChild(
      titleElement
    );



    if (ticketId) {

      const ticketElement =
        document.createElement(
          "div"
        );


      ticketElement.className =
        "ticket-id";


      ticketElement.textContent =
        ticketId;


      resultBox.appendChild(
        ticketElement
      );
    }



    if (details) {

      const detailElement =
        document.createElement(
          "div"
        );


      detailElement.className =
        "details";


      detailElement.style.whiteSpace =
        "pre-line";


      detailElement.textContent =
        details;


      resultBox.appendChild(
        detailElement
      );
    }
  }



  function showNextButton() {

    nextButton.style.display =
      "block";
  }



  window.scanNext =
    function() {

      processing = false;


      resultBox.style.display =
        "none";


      nextButton.style.display =
        "none";
    };



  window.changePin =
    function() {

      staffPin = "";

      processing = false;


      scanner?.stop();


      document
        .getElementById("scannerPage")
        .style.display = "none";


      document
        .getElementById("loginPage")
        .style.display = "block";


      document
        .getElementById("pin")
        .value = "";


      resultBox.style.display =
        "none";


      nextButton.style.display =
        "none";
    };

</script>

</body>
</html>
