<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>LEOWEEN 2026 Check-In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 24px 18px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin-top: 7px;
      color: #999;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 22px;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #090909;
      color: white;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .primary {
      background: #f97316;
      color: white;
    }

    #scannerPage {
      display: none;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: black;
    }

    #qr-video {
      width: 100%;
      min-height: 380px;
      object-fit: cover;
      display: block;
    }

    #status {
      display: none;
      margin-top: 18px;
      padding: 25px 18px;
      border-radius: 16px;
      text-align: center;
    }

    .valid {
      background: #166534;
    }

    .used {
      background: #991b1b;
    }

    .invalid {
      background: #7f1d1d;
    }

    .checking {
      background: #333;
    }

    .big {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .ticketId {
      font-size: 24px;
      font-weight: bold;
      margin-top: 8px;
    }

    .details {
      line-height: 1.7;
      margin-top: 8px;
      white-space: pre-line;
    }

    .small {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-top: 16px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>LEOWEEN 2026</h1>
    <p>Entrance Check-In</p>
  </div>

  <div id="loginPage" class="card">

    <h2>Staff Access</h2>

    <p>Enter the check-in PIN.</p>

    <input
      type="password"
      id="pin"
      inputmode="numeric"
      placeholder="Staff PIN"
    >

    <button
      class="primary"
      onclick="openScanner()"
    >
      Open Scanner
    </button>

  </div>

  <div id="scannerPage">

    <div class="video-wrap">
      <video
        id="qr-video"
        playsinline
      ></video>
    </div>

    <div id="status"></div>

    <div class="small">
      Hold the QR steady inside the camera view.
    </div>

  </div>

</div>

<iframe
  name="apiFrame"
  id="apiFrame"
  style="display:none;">
</iframe>

<form
  id="apiForm"
  method="POST"
  target="apiFrame"
  style="display:none;">

  <input
    type="hidden"
    name="pin"
    id="formPin"
  >

  <input
    type="hidden"
    name="qrData"
    id="formQrData"
  >

</form>

<script type="module">

  import QrScanner
    from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";


  const WEB_APP_URL =
    "https://script.google.com/macros/s/AKfycbxtgii9o32uqmq4IHHs39nJPQTXlxA2Yc1r6alPNhpesU5Zzi4dKwT1GYhVb8s0AF0T/exec";


  let staffPin = "";
  let processing = false;
  let scanner = null;


  const statusBox =
    document.getElementById("status");

  const video =
    document.getElementById("qr-video");


  window.openScanner = async function () {

    const pin =
      document.getElementById("pin")
      .value
      .trim();

    if (!pin) {
      alert("Enter the staff PIN.");
      return;
    }

    staffPin = pin;

    document
      .getElementById("loginPage")
      .style.display = "none";

    document
      .getElementById("scannerPage")
      .style.display = "block";


    scanner = new QrScanner(

      video,

      function (result) {

        if (processing) return;

        const decodedText =
          result.data;

        processTicket(decodedText);
      },

      {
        preferredCamera: "environment",

        maxScansPerSecond: 10,

        highlightScanRegion: true,

        highlightCodeOutline: true,

        returnDetailedScanResult: true
      }
    );


    try {

      await scanner.start();

    }

    catch (error) {

      showMessage(
        "invalid",
        "CAMERA ERROR",
        "",
        "Camera could not be started."
      );

      console.error(error);
    }
  };


  function processTicket(decodedText) {

    if (!decodedText) return;

    if (!decodedText.startsWith("LEOWEEN26|")) {
      return;
    }

    processing = true;

    showMessage(
      "checking",
      "CHECKING...",
      "",
      "Verifying ticket"
    );


    document
      .getElementById("formPin")
      .value = staffPin;


    document
      .getElementById("formQrData")
      .value = decodedText;


    const form =
      document.getElementById("apiForm");


    form.action =
      WEB_APP_URL;


    form.submit();
  }


  window.addEventListener(
    "message",
    function (event) {

      const result =
        event.data;


      if (
        !result ||
        result.source !== "LEOWEEN_API"
      ) {
        return;
      }


      if (result.type === "VALID") {

        showMessage(
          "valid",
          "✓ VALID",
          result.ticketId,
          result.guestName +
          " • " +
          result.ticketType
        );
      }


      else if (result.type === "USED") {

        let info =
          result.guestName +
          " • " +
          result.ticketType;


        if (result.checkInTime) {

          info +=
            "\nPreviously checked in: " +
            result.checkInTime;
        }


        showMessage(
          "used",
          "✕ ALREADY USED",
          result.ticketId,
          info
        );
      }


      else if (
        result.type === "AUTH_ERROR"
      ) {

        showMessage(
          "invalid",
          "✕ WRONG PIN",
          "",
          "Staff PIN is incorrect."
        );
      }


      else {

        showMessage(
          "invalid",
          "✕ INVALID",
          "",
          result.message ||
          "Ticket could not be verified."
        );
      }


      setTimeout(
        function () {

          statusBox.style.display =
            "none";

          processing = false;

        },
        3500
      );
    }
  );


  function showMessage(
    cssClass,
    title,
    ticketId,
    details
  ) {

    statusBox.className =
      cssClass;

    statusBox.style.display =
      "block";

    statusBox.innerHTML = "";


    const titleElement =
      document.createElement("div");

    titleElement.className =
      "big";

    titleElement.textContent =
      title;

    statusBox.appendChild(
      titleElement
    );


    if (ticketId) {

      const idElement =
        document.createElement("div");

      idElement.className =
        "ticketId";

      idElement.textContent =
        ticketId;

      statusBox.appendChild(
        idElement
      );
    }


    if (details) {

      const detailsElement =
        document.createElement("div");

      detailsElement.className =
        "details";

      detailsElement.textContent =
        details;

      statusBox.appendChild(
        detailsElement
      );
    }
  }

</script>

</body>
</html>
